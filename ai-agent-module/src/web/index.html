<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ZafxyrAgent AI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0b0d10; color:#e8eaed; height:100dvh; display:flex; flex-direction:column; }
  header { padding:12px 16px; background:#14171c; border-bottom:1px solid #232830;
           display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#3ddc84; transition:background .2s; }
  header .dot.off { background:#5a6270; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header button { margin-left:auto; background:#232830; color:#c6cbd2; border:0;
                  padding:7px 12px; border-radius:8px; font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:10px 13px; border-radius:14px; font-size:15px;
         line-height:1.5; word-wrap:break-word; position:relative; }
  .user { align-self:flex-end; background:#6b7280; color:#fff; border-bottom-right-radius:4px;
          white-space:pre-wrap; }
  .bot { align-self:flex-start; background:#1b1f26; border-bottom-left-radius:4px; }
  .bot.proactive { background:#16211a; border-left:3px solid #3ddc84; }
  .bot.proactive::before { content:'\1f514 pesan otomatis'; display:block; font-size:11px; color:#5fbf88; margin-bottom:4px; }
  .bot .md { padding-right:44px; }
  .bot p { margin:0 0 6px; }
  .bot p:last-child { margin-bottom:0; }
  .bot h3,.bot h4 { margin:6px 0; font-size:15px; }
  .bot ul { margin:4px 0; padding-left:20px; }
  .bot li { margin:2px 0; }
  .bot code { background:#0c0f13; border:1px solid #232830; border-radius:5px; padding:1px 5px;
              font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:#c9ced6; }
  .bot pre { background:#0c0f13; border:1px solid #232830; border-radius:8px; padding:10px;
             overflow-x:auto; margin:6px 0; }
  .bot pre code { border:0; padding:0; background:none; color:#d6dee9; }
  .bot a { color:#c9ced6; }
  .copy { position:absolute; top:6px; right:6px; background:#232830; color:#9aa4b2; border:0;
          border-radius:6px; font-size:11px; padding:3px 7px; opacity:.85; }
  .copy:active { background:#2c3644; }
  .err { align-self:center; background:#3a1d1d; color:#ff9a9a; font-size:13px; }
  .typing { align-self:flex-start; color:#7b828c; font-size:14px; padding-left:4px; }
  .typing::after { content:'\2026'; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .tool { align-self:stretch; background:#0e1218; border:1px solid #1d2430; border-left:3px solid #3a4a63;
          border-radius:8px; padding:8px 11px; font-size:13px; animation:fadein .18s ease; }
  .tool .tlabel { color:#c9ced6; font-weight:600; }
  .tool .tlabel.run::after { content:' \00b7\00b7\00b7'; color:#5a6270; }
  .tool .tresult { color:#9aa4b2; margin-top:4px; white-space:pre-wrap; word-break:break-word;
                   font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  @keyframes fadein { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
  #chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 12px 10px; }
  #chips:empty { display:none; }
  .chip { background:#141a22; color:#c9ced6; border:1px solid #2a3341; border-radius:16px;
          padding:8px 13px; font-size:13px; font-family:inherit; cursor:pointer; text-align:left; }
  .chip:active { background:#232a34; }
  form { display:flex; gap:8px; padding:12px; background:#14171c; border-top:1px solid #232830; }
  #model { flex:0 0 auto; max-width:40%; background:#0f1216; color:#c9ced6; border:1px solid #232830;
           border-radius:12px; padding:0 8px; font-size:12px; font-family:inherit; text-overflow:ellipsis; }
  #q { flex:1; resize:none; background:#0f1216; color:#e8eaed; border:1px solid #232830;
       border-radius:12px; padding:11px 13px; font-size:15px; font-family:inherit; max-height:140px; }
  #q:focus { outline:none; border-color:#6b7280; }
  #send { background:#6b7280; color:#fff; border:0; border-radius:12px; padding:0 18px;
          font-size:15px; font-weight:600; }
  #send:disabled, #q:disabled { opacity:.5; }
  #hint { font-size:12px; color:#7b828c; padding:10px 16px 0; line-height:1.6; }
  #settings { position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex;
              align-items:flex-end; justify-content:center; z-index:20; }
  #settings.hidden { display:none; }
  .sheet { background:#171b21; width:100%; max-width:520px; border-radius:16px 16px 0 0;
           padding:20px 18px 26px; }
  .sheet h2 { font-size:16px; margin:0 0 6px; }
  .sheet label { display:block; font-size:12px; color:#8b929c; margin:13px 0 5px; }
  .sheet input { width:100%; box-sizing:border-box; background:#0f1216; color:#e8eaed;
                 border:1px solid #232830; border-radius:10px; padding:10px 12px;
                 font-size:14px; font-family:inherit; }
  .sheet .row { display:flex; gap:10px; margin-top:18px; }
  .sheet button { flex:1; padding:11px; border-radius:10px; border:1px solid #2b313b;
                  background:#1d222a; color:#e8eaed; font-size:14px; font-family:inherit; }
  .sheet button.primary { background:#3b82f6; border-color:#3b82f6; color:#fff; font-weight:600; }
  #s_hint { font-size:11.5px; color:#6b7280; margin:11px 0 0; line-height:1.5; word-break:break-all; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>ZafxyrAgent AI</h1>
  <button id="reset" type="button">清空</button>
  <button id="cfg" type="button">设置</button>
</header>
<div id="hint">
  示例：“打开微信” · “看看剩余存储” · “列出 Download 里的文件” · “打开 google.com”</div>
<div id="log"></div>
<div id="chips"></div>
<form id="f">
  <select id="model" title="选择模型"></select>
  <textarea id="q" rows="1" placeholder="让它做什么？例如：打开微信，给张三发消息" autocomplete="off"></textarea>
  <button id="send" type="submit">发送</button>
</form>
<div id="settings" class="hidden">
  <div class="sheet">
    <h2>设置</h2>
    <label for="s_base">API 地址</label>
    <input id="s_base" placeholder="https://api.deepseek.com/v1" autocomplete="off">
    <label for="s_key">API Key</label>
    <input id="s_key" type="password" placeholder="留空表示不修改" autocomplete="off">
    <label for="s_model">模型</label>
    <input id="s_model" placeholder="deepseek-chat" autocomplete="off">
    <p id="s_hint"></p>
    <div class="row">
      <button id="s_cancel" type="button">取消</button>
      <button id="s_save" type="button" class="primary">保存</button>
    </div>
    <div class="row">
      <button id="s_random" type="button">随机换一个模型</button>
    </div>
  </div>
</div>
<script>
const log = document.getElementById('log');
const q = document.getElementById('q');
const f = document.getElementById('f');
const send = document.getElementById('send');
const chipsEl = document.getElementById('chips');
const dot = document.getElementById('dot');
const modelSel = document.getElementById('model');

let statusEl = null;
let isBusy = false;
let replied = false;
const toolEls = {};

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function inline(s) {
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  return s;
}
function md(src) {
  const lines = esc(src || '').split('\n');
  let html = '', inCode = false, inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (/^```/.test(ln.trim())) {
      if (!inCode) { closeList(); html += '<pre><code>'; inCode = true; }
      else { html += '</code></pre>'; inCode = false; }
      continue;
    }
    if (inCode) { html += ln + '\n'; continue; }
    const h = ln.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); html += '<h4>' + inline(h[2]) + '</h4>'; continue; }
    const li = ln.match(/^\s*[-*]\s+(.*)$/);
    if (li) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(li[1]) + '</li>'; continue; }
    closeList();
    html += inline(ln) + '<br>';
  }
  closeList();
  if (inCode) html += '</code></pre>';
  return html;
}

function addUser(text) {
  const d = document.createElement('div');
  d.className = 'msg user';
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function addBot(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg bot' + (cls ? ' ' + cls : '');
  const body = document.createElement('div');
  body.className = 'md';
  body.innerHTML = md(text);
  d.appendChild(body);
  const c = document.createElement('button');
  c.className = 'copy';
  c.type = 'button';
  c.textContent = 'Salin';
  c.addEventListener('click', () => {
    navigator.clipboard.writeText(text).then(() => { c.textContent = 'Tersalin'; setTimeout(() => c.textContent = 'Salin', 1200); });
  });
  d.appendChild(c);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

let stream = null;
function streamToken(tok) {
  hideStatus();
  if (!stream) {
    const d = document.createElement('div');
    d.className = 'msg bot';
    const body = document.createElement('div');
    body.className = 'md';
    d.appendChild(body);
    log.appendChild(d);
    stream = { el: d, body: body, text: '' };
  }
  stream.text += tok;
  stream.body.textContent = stream.text;
  log.scrollTop = log.scrollHeight;
}
function flushStream(finalText) {
  if (!stream) return false;
  const text = (finalText != null && finalText !== '') ? finalText : stream.text;
  stream.body.innerHTML = md(text);
  const c = document.createElement('button');
  c.className = 'copy';
  c.type = 'button';
  c.textContent = 'Salin';
  c.addEventListener('click', () => {
    navigator.clipboard.writeText(text).then(() => { c.textContent = 'Tersalin'; setTimeout(() => c.textContent = 'Salin', 1200); });
  });
  stream.el.appendChild(c);
  stream = null;
  log.scrollTop = log.scrollHeight;
  return true;
}
function botMessage(text, suggestions) {
  if (!flushStream(text)) addBot(text);
  renderChips(suggestions);
}

function addErr(text) {
  const d = document.createElement('div');
  d.className = 'msg err';
  d.textContent = '\u26a0 ' + text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function showStatus(t) {
  if (!statusEl) { statusEl = document.createElement('div'); statusEl.className = 'typing'; }
  statusEl.textContent = t;
  log.appendChild(statusEl);
  log.scrollTop = log.scrollHeight;
}
function hideStatus() { if (statusEl) { statusEl.remove(); statusEl = null; } }

function toolStart(e) {
  const d = document.createElement('div');
  d.className = 'tool';
  const l = document.createElement('div');
  l.className = 'tlabel run';
  l.textContent = e.label || e.name || 'aksi';
  const r = document.createElement('div');
  r.className = 'tresult';
  r.style.display = 'none';
  d.appendChild(l); d.appendChild(r);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  toolEls[e.id] = { label: l, result: r };
}
function toolDone(e) {
  const t = toolEls[e.id];
  if (!t) return;
  t.label.classList.remove('run');
  if (e.result) { t.result.textContent = e.result; t.result.style.display = 'block'; }
  log.scrollTop = log.scrollHeight;
}

function renderChips(list) {
  chipsEl.innerHTML = '';
  if (!Array.isArray(list)) return;
  list.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = s;
    b.addEventListener('click', () => sendText(s));
    chipsEl.appendChild(b);
  });
}
function clearChips() { chipsEl.innerHTML = ''; }

function shortModel(m) {
  return String(m).replace(/^[^/]+\//, '').replace(/:free$/, ' \u00b7free');
}
async function loadModels() {
  try {
    const r = await fetch('/models');
    const d = await r.json();
    const list = (d && d.models) || [];
    if (d && d.current && !list.includes(d.current)) list.unshift(d.current);
    modelSel.innerHTML = '';
    list.forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = shortModel(m); o.title = m;
      modelSel.appendChild(o);
    });
    if (d && d.current) modelSel.value = d.current;
  } catch (e) {}
}
async function setModel(m) {
  try {
    await fetch('/model', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: m }) });
  } catch (e) {}
}
async function randomizeModel() {
  try {
    const r = await fetch('/model/random', { method: 'POST' });
    const d = await r.json();
    if (d && d.model) modelSel.value = d.model;
  } catch (e) {}
}

function busy(b) {
  isBusy = b;
  q.disabled = b;
  send.disabled = b;
  if (!b) q.focus();
}

async function loadHistory() {
  try {
    const r = await fetch('/history');
    const h = await r.json();
    if (Array.isArray(h)) h.forEach(m => m.role === 'user' ? addUser(m.content) : addBot(m.content));
  } catch (e) {}
}

async function sendText(text) {
  text = (text || '').trim();
  if (!text || isBusy) return;
  addUser(text);
  clearChips();
  busy(true);
  showStatus('Berpikir');
  replied = false;
  let data = null;
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    data = await r.json();
  } catch (e) {
    data = { error: e.message };
  }
  setTimeout(() => {
    if (replied) return;
    hideStatus();
    if (data && data.error) addErr(data.error);
    else if (data && data.reply) botMessage(data.reply, data.suggestions);
    busy(false);
  }, 2500);
}

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { dot.classList.remove('off'); };
  es.onerror = () => { dot.classList.add('off'); };
  es.onmessage = (ev) => {
    let d;
    try { d = JSON.parse(ev.data); } catch (_) { return; }
    if (d.type === 'status') {
      if (isBusy) showStatus(d.text);
    } else if (d.type === 'token') {
      streamToken(d.text || '');
    } else if (d.type === 'tool') {
      if (d.state === 'start') { flushStream(null); toolStart(d); } else toolDone(d);
    } else if (d.type === 'reply') {
      replied = true;
      hideStatus();
      botMessage(d.text, d.suggestions);
      busy(false);
    } else if (d.type === 'message') {
      hideStatus();
      addBot(d.text, 'proactive');
    } else if (d.type === 'error') {
      replied = true;
      hideStatus();
      flushStream(null);
      addErr(d.text);
      busy(false);
    }
  };
}

f.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = q.value;
  q.value = '';
  q.style.height = 'auto';
  sendText(text);
});

q.addEventListener('input', () => {
  q.style.height = 'auto';
  q.style.height = Math.min(q.scrollHeight, 140) + 'px';
});

document.getElementById('reset').addEventListener('click', async () => {
  await fetch('/reset', { method: 'POST' });
  log.innerHTML = '';
  clearChips();
  hideStatus();
});

modelSel.addEventListener('change', () => setModel(modelSel.value));

// ---- 设置面板：改 API 地址 / Key / 模型，不用去动 /data/adb 下的 JSON ----
const settingsEl = document.getElementById('settings');
const sBase = document.getElementById('s_base');
const sKey = document.getElementById('s_key');
const sModel = document.getElementById('s_model');
const sHint = document.getElementById('s_hint');

document.getElementById('cfg').addEventListener('click', async () => {
  settingsEl.classList.remove('hidden');
  sHint.textContent = '读取中…';
  try {
    const c = await (await fetch('/config')).json();
    sBase.value = c.base_url || '';
    sModel.value = c.model || '';
    sKey.value = '';
    sHint.textContent = (c.has_key ? '已配置 API Key。' : '还没配置 API Key。') +
      ' 配置文件：' + (c.config_path || '未知');
  } catch (e) {
    sHint.textContent = '读取配置失败：' + e;
  }
});

document.getElementById('s_cancel').addEventListener('click', () => {
  settingsEl.classList.add('hidden');
});

document.getElementById('s_save').addEventListener('click', async () => {
  const body = { base_url: sBase.value.trim(), model: sModel.value.trim() };
  if (sKey.value.trim()) body.api_key = sKey.value.trim();
  try {
    const r = await fetch('/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (r.ok) {
      sHint.textContent = '已保存。';
      settingsEl.classList.add('hidden');
      location.reload();
    } else {
      sHint.textContent = '保存失败（HTTP ' + r.status + '）';
    }
  } catch (e) {
    sHint.textContent = '保存失败：' + e;
  }
});

document.getElementById('s_random').addEventListener('click', async () => {
  await randomizeModel();
  settingsEl.classList.add('hidden');
});

document.addEventListener('visibilitychange', () => {
  // 原来这里每次切回页面就随机换模型，会把用户明确配置的模型
  // 悄悄换成别的（配了 DeepSeek 却走 Gemini 的 key，直接报错）。
  // 改成只刷新模型状态，不再自动随机。
  if (!document.hidden && !isBusy) loadModels();
});

connect();
loadHistory();
loadModels();
q.focus();
</script>
</body>
</html>
