<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="color-scheme" content="dark light">
<title>ZafxyrAgent</title>
<script>
/* 在样式生效前定主题，避免加载瞬间闪白/闪黑 */
(function () {
  try {
    var m = localStorage.getItem("zafxyr-theme") || "light";
    var t = m === "system"
      ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      : (m === "light" ? "light" : "dark");
    document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<style>
/* ==========================================================================
   设计 token 取自 DSH 深色主题（dsh-client-ui-theme 的 --dsw-alias-* 映射）
   背景 #151517 / 层 #232324 #2c2c2e #353638 / 强调 #7aaaff
   ========================================================================== */
:root{
  --bg:#151517;
  --layer1:#1b1b1c;
  --layer2:#232324;
  --layer3:#2c2c2e;
  --layer4:#353638;
  --border:#ffffff0f;
  --border2:#ffffff1f;
  --text:#f9fafb;
  --text2:#cfd3d6;
  --text3:#adb2b8;
  --text4:#81858c;
  --accent:#7aaaff;
  --accent2:#5686fe;
  --danger:#f25a5a;
  --ok:#4ed17e;
  --hover:#ffffff14;
  --active:#ffffff24;
  --bubble:#2c2c2e;
  --glass:rgba(27,27,28,.86);
  --glass-strong:rgba(35,35,36,.94);
  --mask:rgba(0,0,0,.55);
  --radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
/* 浅色主题：取自 DSH 的浅色 token（neutral-bluish / deepseek 系列） */
:root[data-theme="light"]{
  --bg:#ffffff;
  --layer1:#f9fafb;
  --layer2:#f5f6f7;
  --layer3:#eef1f5;
  --layer4:#e1e5ee;
  --border:#0000000f;
  --border2:#0000001a;
  --text:#0f1115;
  --text2:#3c3c3d;
  --text3:#61666b;
  --text4:#979da6;
  --accent:#4176e6;
  --accent2:#3b82f6;
  --danger:#ec1313;
  --ok:#22c55e;
  --hover:#0000000f;
  --active:#0000001a;
  --bubble:#edf3fe;
  --glass:rgba(255,255,255,.82);
  --glass-strong:rgba(249,250,251,.95);
  --mask:rgba(15,17,21,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 手机端不显示滚动条（手势滚动照常） */
*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{width:0;height:0;background:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  overscroll-behavior:none;
  display:flex;flex-direction:column;height:100dvh;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.45}
input,textarea,select{font-family:inherit}

/* ---------------- 顶栏 ---------------- */
#bar{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:calc(var(--safe-t) + 8px) 10px 8px;
  background:var(--bg);border-bottom:1px solid var(--border);
}
#bar .ico{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  color:var(--text2);font-size:17px;flex:0 0 auto;
}
#bar .ico:active{background:var(--hover)}
#bar .grow{flex:1;min-width:0}
#title{
  font-size:14.5px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-align:center;
}
#subtitle{font-size:11px;color:var(--text4);text-align:center;margin-top:1px}

/* ---------------- 消息区 ---------------- */
#log{
  flex:1;overflow-y:auto;padding:14px 12px 8px;
  display:flex;flex-direction:column;gap:12px;
  -webkit-overflow-scrolling:touch;
}
#log:empty{display:none}

.empty{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:0 28px 12vh;gap:18px;
}
.empty h2{margin:0;font-size:19px;font-weight:600;letter-spacing:.2px}
.empty p{margin:0;color:var(--text3);font-size:13.5px;line-height:1.7}
.empty .examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.empty .examples button{
  border:1px solid var(--border2);background:var(--layer2);color:var(--text2);
  padding:8px 12px;border-radius:11px;font-size:13px;
}
.empty .examples button:active{background:var(--layer3)}

.msg{max-width:88%;font-size:14.5px;line-height:1.62;white-space:pre-wrap;word-break:break-word}
.msg.me{
  align-self:flex-end;background:var(--accent2);color:#fff;
  padding:9px 13px;border-radius:var(--radius);border-bottom-right-radius:5px;
}
.msg.ai{
  align-self:flex-start;color:var(--text);
  padding:9px 13px;border-radius:var(--radius);border-bottom-left-radius:5px;
  background:var(--bubble);
}
.msg.ai.streaming::after{
  content:"";display:inline-block;width:2px;height:1em;margin-left:2px;
  background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}

.note{align-self:center;font-size:12px;color:var(--text4);padding:2px 8px}

/* Markdown 渲染后的内容 */
.msg.ai p{margin:0 0 8px}
.msg.ai p:last-child{margin-bottom:0}
.msg.ai strong{color:var(--text);font-weight:600}
.msg.ai em{font-style:italic;color:var(--text2)}
.msg.ai a{color:var(--accent);text-decoration:none;border-bottom:1px solid #7aaaff44}
.msg.ai code{
  background:var(--layer1);border:1px solid var(--border);border-radius:5px;
  padding:1px 5px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#9ecbff;
}
.msg.ai pre{
  background:var(--layer1);border:1px solid var(--border);border-radius:9px;
  padding:10px 12px;overflow-x:auto;margin:8px 0;
}
.msg.ai pre code{background:none;border:0;padding:0;color:var(--text2);font-size:12px}
.msg.ai ul,.msg.ai ol{margin:6px 0;padding-left:20px}
.msg.ai li{margin:3px 0}
.msg.ai .h{font-weight:600;margin:10px 0 5px;color:var(--text)}
.msg.ai .tw{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
.msg.ai table{border-collapse:collapse;font-size:13px;width:100%}
.msg.ai th,.msg.ai td{
  border:1px solid var(--border2);padding:5px 9px;text-align:left;
  white-space:nowrap;
}
.msg.ai th{background:var(--layer1);color:var(--text2);font-weight:600}

/* ---------------- 工具卡片 ---------------- */
.tool{
  align-self:flex-start;width:100%;max-width:100%;
  background:var(--layer2);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;font-size:13px;
}
.tool .th{display:flex;align-items:center;gap:8px;padding:9px 12px;color:var(--text3)}
.tool .th .nm{color:var(--accent);font-weight:600;font-size:12.5px;flex:0 0 auto}
.tool .th .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .th .st{flex:0 0 auto;font-size:11px;color:var(--text4)}
.tool .th .st.done{color:var(--ok)}
.tool .tb{
  display:none;padding:0 12px 10px;color:var(--text4);
  font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;
  border-top:1px solid var(--border);margin-top:0;padding-top:9px;
}
.tool.open .tb{display:block}

/* ---------------- 建议 chips ---------------- */
#chips{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:7px;padding:0 12px 8px}
#chips:empty{display:none}
#chips button{
  border:1px solid var(--border2);background:var(--glass-strong);color:var(--text2);
  padding:7px 11px;border-radius:10px;font-size:12.5px;
}
#chips button:active{background:var(--layer3)}

/* ---------------- 输入区 ---------------- */
#composer{
  flex:0 0 auto;padding:0 10px calc(8px + var(--safe-b));
  background:var(--bg);border-top:1px solid var(--border);
}
#meta{
  display:flex;align-items:center;gap:6px;padding:7px 2px;
}
#model{
  flex:1;min-width:0;appearance:none;background:var(--layer2);
  border:1px solid var(--border2);color:var(--text2);
  border-radius:10px;padding:7px 26px 7px 10px;font-size:12.5px;
  background-image:linear-gradient(45deg,transparent 50%,var(--text4) 50%),linear-gradient(135deg,var(--text4) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#btn-refresh{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  color:var(--text3);font-size:14px;border:1px solid var(--border2);flex:0 0 auto;
}
#btn-refresh:active{background:var(--hover)}
#btn-refresh.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#inputrow{display:flex;align-items:flex-end;gap:8px}
#q{
  flex:1;min-height:42px;max-height:132px;resize:none;padding:10px 13px;
  background:var(--layer2);border:1px solid var(--border2);border-radius:13px;
  color:var(--text);font-size:15px;line-height:1.45;outline:none;
  transition:border-color .15s;
}
#q::placeholder{color:var(--text4)}
#q:focus{border-color:var(--accent2)}
#send{
  width:42px;height:42px;flex:0 0 auto;border-radius:13px;
  background:var(--accent2);color:#fff;font-size:18px;font-weight:700;
  display:grid;place-items:center;
}
#send:active{background:var(--accent)}

/* ---------------- 抽屉 ---------------- */
#mask{
  position:fixed;inset:0;background:var(--mask);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
#mask.on{opacity:1;pointer-events:auto}

#drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(82vw,340px);z-index:50;
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);
  backdrop-filter:blur(26px) saturate(1.6);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transform:translateX(-102%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  padding-top:var(--safe-t);
}
#drawer.on{transform:none}
.dw-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 14px 8px;font-size:13px;font-weight:600;color:var(--text3);
  letter-spacing:.4px;
}
.dw-head button{width:30px;height:30px;border-radius:8px;color:var(--text3);font-size:18px}
.dw-new{
  margin:4px 12px 10px;padding:10px 12px;border-radius:11px;
  background:var(--layer2);border:1px solid var(--border2);
  color:var(--text);font-size:13.5px;display:flex;align-items:center;gap:8px;
}
.dw-new:active{background:var(--layer3)}
#dw-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.dw-item{
  display:flex;align-items:center;gap:9px;padding:10px 10px;border-radius:10px;
  margin-bottom:2px;
}
.dw-item.active{background:var(--layer3)}
.dw-item:active{background:var(--layer2)}
.dw-item .txt{flex:1;min-width:0}
.dw-item .t1{
  font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;
}
.dw-item .t2{font-size:11px;color:var(--text4);margin-top:2px}
.dw-item .more{
  width:28px;height:28px;border-radius:7px;color:var(--text4);font-size:15px;
  display:grid;place-items:center;flex:0 0 auto;
}
.dw-item .more:active{background:var(--hover)}
.dw-empty{padding:22px 14px;color:var(--text4);font-size:12.5px;text-align:center}
.dw-foot{padding:8px 12px calc(12px + var(--safe-b));border-top:1px solid var(--border)}
.dw-foot button{
  width:100%;padding:10px;border-radius:10px;background:var(--layer2);
  border:1px solid var(--border2);font-size:13px;color:var(--text2);
  display:flex;align-items:center;justify-content:space-between;
}
.dw-foot button:active{background:var(--layer3)}
.dw-foot .cnt{color:var(--text4);font-size:12px}

/* 会话操作小菜单 */
#item-menu{
  position:fixed;z-index:60;background:var(--layer3);border:1px solid var(--border2);
  border-radius:12px;padding:5px;min-width:132px;display:none;
  box-shadow:0 10px 30px #00000080;
}
#item-menu.on{display:block}
#item-menu button{
  display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;
  border-radius:8px;font-size:13.5px;color:var(--text2);text-align:left;
}
#item-menu button:active{background:var(--hover)}
#item-menu button.danger{color:var(--danger)}

/* ---------------- 归档视图 ---------------- */
#archive{
  position:fixed;inset:0;z-index:45;background:var(--bg);
  display:none;flex-direction:column;padding-top:var(--safe-t);
}
#archive.on{display:flex}
.ar-head{
  display:flex;align-items:center;gap:8px;padding:12px 12px 10px;
  border-bottom:1px solid var(--border);
}
.ar-head .t{flex:1;font-size:15px;font-weight:600}
.ar-head button{
  padding:7px 11px;border-radius:9px;font-size:12.5px;
  border:1px solid var(--border2);color:var(--text2);
}
.ar-head button.danger{color:var(--danger);border-color:#f25a5a3d}
#ar-list{flex:1;overflow-y:auto;padding:8px 10px calc(14px + var(--safe-b))}
.ar-item{
  display:flex;align-items:center;gap:9px;padding:11px 11px;
  border-radius:11px;background:var(--layer2);margin-bottom:6px;
  border:1px solid var(--border);
}
.ar-item .txt{flex:1;min-width:0}
.ar-item .t1{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-item .t2{font-size:11px;color:var(--text4);margin-top:2px}
.ar-item .act{
  display:flex;gap:4px;flex:0 0 auto;
}
.ar-item .act button{
  padding:6px 9px;border-radius:8px;font-size:12px;color:var(--text3);
  border:1px solid var(--border2);
}
.ar-item .act button:active{background:var(--hover)}
.ar-item .act button.danger{color:var(--danger)}

/* ---------------- 设置面板 ---------------- */
#settings{
  position:fixed;inset:0;z-index:55;background:#00000080;
  display:none;align-items:flex-end;
}
#settings.on{display:flex}
.sheet{
  width:100%;background:var(--glass-strong);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);
  backdrop-filter:blur(26px) saturate(1.6);
  border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + var(--safe-b));
  border-top:1px solid var(--border2);
  max-height:88dvh;overflow-y:auto;
  animation:up .24s cubic-bezier(.32,.72,0,1);
}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 14px;font-size:15.5px;font-weight:600}
.sheet label{display:block;font-size:12px;color:var(--text4);margin:12px 0 5px}
.sheet input{
  width:100%;padding:10px 12px;border-radius:10px;
  background:var(--bg);border:1px solid var(--border2);color:var(--text);
  font-size:14px;outline:none;
}
.sheet input:focus{border-color:var(--accent2)}
.sheet .hint{font-size:11.5px;color:var(--text4);margin:8px 0 0;line-height:1.6;word-break:break-all}
.sheet .seg{display:flex;gap:6px;margin-top:6px}
.sheet .seg button{
  flex:1;padding:9px 6px;border-radius:10px;font-size:13px;
  background:var(--bg);border:1px solid var(--border2);color:var(--text3);
}
.sheet .seg button.on{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
.sheet .row{display:flex;gap:9px;margin-top:16px}
.sheet .row button{
  flex:1;padding:11px;border-radius:11px;font-size:14px;
  background:var(--layer4);color:var(--text);
}
.sheet .row button.primary{background:var(--accent2);color:#fff;font-weight:600}
.sheet .row button:active{filter:brightness(1.1)}

/* ---------------- 轻提示 ---------------- */
#toast{
  position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);
  background:var(--layer4);color:var(--text);font-size:13px;
  padding:9px 15px;border-radius:11px;z-index:70;
  opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:86vw;text-align:center;
}
#toast.on{opacity:1}
</style>
</head>
<body>

<header id="bar">
  <button class="ico" id="btn-menu" aria-label="会话列表">☰</button>
  <div class="grow">
    <div id="title">新会话</div>
    <div id="subtitle"></div>
  </div>
  <button class="ico" id="btn-new" aria-label="新建会话">＋</button>
  <button class="ico" id="btn-settings" aria-label="设置">⚙</button>
</header>

<main id="log"></main>
<div id="chips"></div>

<footer id="composer">
  <div id="meta">
    <select id="model" aria-label="选择模型"></select>
    <button id="btn-refresh" aria-label="刷新模型列表">↻</button>
  </div>
  <div id="inputrow">
    <textarea id="q" rows="1" placeholder="说点什么…" enterkeyhint="send"></textarea>
    <button id="send" aria-label="发送">↑</button>
  </div>
</footer>

<!-- 抽屉 -->
<div id="mask"></div>
<aside id="drawer">
  <div class="dw-head">
    <span>会话</span>
    <button id="dw-close" aria-label="关闭">✕</button>
  </div>
  <button class="dw-new" id="dw-new">＋ 新建会话</button>
  <div id="dw-list"></div>
  <div class="dw-foot">
    <button id="dw-archived">
      <span>🗄 已归档</span>
      <span class="cnt" id="dw-arch-count">0</span>
    </button>
  </div>
</aside>

<!-- 会话项操作菜单 -->
<div id="item-menu">
  <button data-act="archive">归档</button>
  <button data-act="delete" class="danger">删除</button>
</div>

<!-- 归档视图 -->
<section id="archive">
  <div class="ar-head">
    <button id="ar-close" aria-label="返回">←</button>
    <span class="t">已归档</span>
    <button id="ar-clear" class="danger">清空全部</button>
  </div>
  <div id="ar-list"></div>
</section>

<!-- 设置 -->
<div id="settings">
  <div class="sheet">
    <h3>设置</h3>
    <label for="s-base">API 地址</label>
    <input id="s-base" placeholder="https://api.deepseek.com/v1" autocomplete="off">
    <label for="s-key">API Key</label>
    <input id="s-key" type="password" placeholder="留空表示不修改" autocomplete="off">
    <label for="s-model">默认模型</label>
    <input id="s-model" placeholder="deepseek-chat" autocomplete="off">
    <label for="s-tokens">最大回复 token</label>
    <input id="s-tokens" type="number" inputmode="numeric" placeholder="2048">
    <label>外观</label>
    <div class="seg" id="theme-seg">
      <button type="button" data-th="system">跟随系统</button>
      <button type="button" data-th="dark">深色</button>
      <button type="button" data-th="light">浅色</button>
    </div>
    <p class="hint" id="s-hint"></p>
    <div class="row">
      <button id="s-cancel">取消</button>
      <button id="s-save" class="primary">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   状态
   ========================================================================== */
const S = {
  sessions: [],
  archived: [],
  activeId: null,
  activeTitle: "新会话",
  busy: false,
  menuTarget: null,
  modelList: [],
};

const $ = (id) => document.getElementById(id);
const logEl = $("log"), chipsEl = $("chips"), qEl = $("q"), sendEl = $("send");
const titleEl = $("title"), subtitleEl = $("subtitle");

/* ==========================================================================
   工具
   ========================================================================== */
function toast(msg, ms = 1800) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("on"), ms);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function relTime(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  const sameDay = d.toDateString() === now.toDateString();
  const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  if (sameDay) return "今天 " + hm;
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "昨天 " + hm;
  return (d.getMonth() + 1) + "月" + d.getDate() + "日";
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : r.text();
}

const post = (p, body) => api(p, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {})
});

   消息渲染

  clearLog();
  const box = el("div", "empty");
  box.appendChild(el("h2", "", "能动手的助手"));
  box.appendChild(el("p", "", "它跑在这台手机上，有 root 权限。可以开应用、读屏幕、点按钮、跑命令。"));
  const ex = el("div", "examples");
  ["看看现在屏幕上有什么", "打开设置，把深色模式打开", "看看还剩多少存储", "10 分钟后提醒我喝水"]
    .forEach(t => {

      b.onclick = () => { qEl.value = t; send(); };

function addMsg(role, text, rich) {
  const d = el("div", "msg " + (role === "user" ? "me" : "ai"));

function addToolCard(name, label) {

function scrollBottom() {

/* ==========================================================================
   轻量 Markdown 渲染
   —— 模型经常输出表格、粗体、代码块，原样显示没法看。
   先整体 escape，再套有限规则，避免 XSS。
   ========================================================================== */
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function renderMD(src) {
  if (!src) return "";
  const codeBlocks = [];
  // 先抽走围栏代码块，免得里面的字符被后面的行内规则破坏
  let s = String(src).replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, (m, code) => {
    codeBlocks.push(code);
    return "\u0001CB" + (codeBlocks.length - 1) + "\u0001";
  });

  let h = escHtml(s);

  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const lines = h.split("\n");
  const out = [];
  let i = 0;
  const isRow = (t) => /^\s*\|.*\|\s*$/.test(t);

  while (i < lines.length) {
    const line = lines[i];

    // 表格：上一行是表头，下一行是分隔行
    if (isRow(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const head = line.split("|").slice(1, -1).map(c => c.trim());
      const rows = [];
      i += 2;
      while (i < lines.length && isRow(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map(c => c.trim()));
        i++;
      }
      let t = '<div class="tw"><table><thead><tr>' +
        head.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
      t += rows.map(r => "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("");
      t += "</tbody></table></div>";
      out.push(t);
      continue;
    }

    // 标题
    if (/^#{1,6}\s+/.test(line)) {
      out.push('<div class="h">' + line.replace(/^#{1,6}\s+/, "") + "</div>");
      i++;
      continue;
    }

    // 无序列表
    if (/^\s*[-*+]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*+]\s+/, ""));
        i++;
      }
      out.push("<ul>" + items.map(x => "<li>" + x + "</li>").join("") + "</ul>");
      continue;
    }

    // 有序列表
    if (/^\s*\d+[.)]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+[.)]\s+/, ""));
        i++;
      }
      out.push("<ol>" + items.map(x => "<li>" + x + "</li>").join("") + "</ol>");
      continue;
    }

    out.push(line);
    i++;
  }

  h = out.join("\n");
  h = h.replace(/\u0001CB(\d+)\u0001/g, (m, idx) =>
    "<pre><code>" + escHtml(codeBlocks[+idx]) + "</code></pre>");

  // 空行分段，单换行折行
  h = h.replace(/\n{2,}/g, "</p><p>");
  h = h.replace(/\n/g, "<br>");
  return "<p>" + h + "</p>";
}

function setRich(node, raw) {
  node.dataset.raw = raw;
  node.innerHTML = renderMD(raw);
}

/* ==========================================================================
   会话
   ========================================================================== */
async function loadSessions() {
  const [live, arch] = await Promise.all([
    api("/sessions"),
    api("/sessions?archived=1"),
  ]);
  S.sessions = (live && live.sessions) || [];
  S.archived = (arch && arch.sessions) || [];
  if (live && live.active) S.activeId = live.active;

  const cur = S.sessions.find(s => s.active) || S.sessions.find(s => s.id === S.activeId);
  if (cur) {
    S.activeTitle = cur.title || "新会话";
    titleEl.textContent = S.activeTitle;
    subtitleEl.textContent = cur.count ? cur.count + " 条消息 · " + relTime(cur.updated) : "";
  }
  renderDrawer();
  updateArchCount();
}

function renderDrawer() {
  const list = $("dw-list");
  list.innerHTML = "";
  if (!S.sessions.length) {
    list.appendChild(el("div", "dw-empty", "还没有会话"));
    return;
  }
  S.sessions.forEach(s => {
    const item = el("div", "dw-item" + (s.active ? " active" : ""));
    const txt = el("div", "txt");
    txt.appendChild(el("div", "t1", s.title || "新会话"));
    txt.appendChild(el("div", "t2", relTime(s.updated) + (s.count ? " · " + s.count + " 条" : "")));
    item.appendChild(txt);

    const more = el("button", "more", "⋯");
    more.onclick = (e) => {
      e.stopPropagation();
      openItemMenu(more, s);
    };
    item.appendChild(more);

    item.onclick = () => { if (!s.active) switchSession(s.id); };
    list.appendChild(item);
  });
}

function updateArchCount() {
  $("dw-arch-count").textContent = String(S.archived.length);
}

async function switchSession(id) {
  try {
    const r = await post("/sessions/switch", { id });
    if (!r.ok) { toast("切换失败"); return; }
    S.activeId = id;
    closeDrawer();
    await loadSessions();
    renderMessages(r.messages || []);
    clearChips();
  } catch (e) { toast("切换失败：" + e); }
}

async function newSession() {
  try {
    const r = await post("/sessions");
    if (!r.ok) { toast("新建失败"); return; }
    closeDrawer();
    closeArchive();
    await loadSessions();
    renderEmpty();
    clearChips();
    qEl.focus();
  } catch (e) { toast("新建失败：" + e); }
}

function renderMessages(msgs) {
  clearLog();
  if (!msgs || !msgs.length) { renderEmpty(); return; }
  msgs.forEach(m => {
    if (m.role === "user") addMsg("user", m.content || "");
    else if (m.role === "assistant") addMsg("assistant", m.content || "", true);
  });
  scrollBottom();
}

async function deleteSession(id) {
  if (!confirm("删除这条会话？不可恢复。")) return;
  const r = await api("/sessions?id=" + encodeURIComponent(id), { method: "DELETE" });
  if (!r.ok) { toast("删除失败"); return; }
  toast("已删除");
  await loadSessions();
  if (r.active === S.activeId) {
    const h = await api("/history");
    renderMessages(h);
  }
}

async function archiveSession(id, on) {
  const r = await post("/sessions/archive", { id, archived: on });
  if (!r.ok) { toast("操作失败"); return; }
  toast(on ? "已归档" : "已恢复");
  const needReloadMsgs = on && r.active === S.activeId;
  await loadSessions();
  if (needReloadMsgs) {
    const h = await api("/history");
    renderMessages(h);
  }
}

/* ---------- 会话项菜单 ---------- */
function openItemMenu(anchor, session) {
  const m = $("item-menu");
  S.menuTarget = session;
  const r = anchor.getBoundingClientRect();
  m.classList.add("on");
  const h = m.offsetHeight || 92;
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  m.style.top = top + "px";
  m.style.left = Math.max(8, Math.min(r.right - 132, window.innerWidth - 148)) + "px";
}

function closeItemMenu() {
  $("item-menu").classList.remove("on");
  S.menuTarget = null;
}

$("item-menu").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn || !S.menuTarget) return;
  const id = S.menuTarget.id;
  const act = btn.dataset.act;
  closeItemMenu();
  if (act === "archive") await archiveSession(id, true);
  else if (act === "delete") await deleteSession(id);
});

document.addEventListener("click", (e) => {
  if (!e.target.closest("#item-menu") && !e.target.closest(".more")) closeItemMenu();
});

/* ---------- 抽屉 ---------- */
function openDrawer() {
  $("mask").classList.add("on");
  $("drawer").classList.add("on");
}
function closeDrawer() {
  $("mask").classList.remove("on");
  $("drawer").classList.remove("on");
}
$("btn-menu").onclick = openDrawer;
$("dw-close").onclick = closeDrawer;
$("mask").onclick = closeDrawer;
$("dw-new").onclick = newSession;
$("btn-new").onclick = newSession;

/* ---------- 归档视图 ---------- */
async function openArchive() {
  closeDrawer();
  $("archive").classList.add("on");
  await loadSessions();
  renderArchive();
}
function closeArchive() { $("archive").classList.remove("on"); }

function renderArchive() {
  const list = $("ar-list");
  list.innerHTML = "";
  if (!S.archived.length) {
    list.appendChild(el("div", "dw-empty", "没有归档的会话"));
    return;
  }
  S.archived.forEach(s => {
    const item = el("div", "ar-item");
    const txt = el("div", "txt");
    txt.appendChild(el("div", "t1", s.title || "新会话"));
    txt.appendChild(el("div", "t2", relTime(s.updated) + (s.count ? " · " + s.count + " 条" : "")));
    item.appendChild(txt);

    const act = el("div", "act");
    const back = el("button", "", "恢复");
    back.onclick = async () => { await archiveSession(s.id, false); renderArchive(); };
    const del = el("button", "danger", "删除");
    del.onclick = async () => { await deleteSession(s.id); renderArchive(); };
    act.appendChild(back);
    act.appendChild(del);
    item.appendChild(act);
    list.appendChild(item);
  });
}

$("ar-close").onclick = closeArchive;
$("dw-archived").onclick = openArchive;
$("ar-clear").onclick = async () => {
  if (!S.archived.length) { toast("没有可清空的归档"); return; }
  if (!confirm("清空全部 " + S.archived.length + " 条归档会话？不可恢复。")) return;
  const r = await api("/sessions/archived", { method: "DELETE" });
  if (!r.ok) { toast("清空失败"); return; }
  toast("已清空 " + (r.removed || 0) + " 条");
  await loadSessions();
  renderArchive();
};

/* ==========================================================================
   模型
   ========================================================================== */
async function loadModels(force) {
  const btn = $("btn-refresh");
  btn.classList.add("spin");
  try {
    let d;
    try {
      d = await api("/models/remote" + (force ? "?refresh=1" : ""));
    } catch (_) { d = null; }
    if (!d || !d.ok) {
      d = await api("/models");
    }
    const list = (d && d.models) || [];
    const cur = (d && d.current) || "";
    S.modelList = list;
    const sel = $("model");
    sel.innerHTML = "";
    if (!list.length) {
      const o = el("option", "", cur || "未配置模型");
      o.value = cur;
      sel.appendChild(o);
    } else {
      list.forEach(m => {
        const o = el("option", "", m);
        o.value = m;
        if (m === cur) o.selected = true;
        sel.appendChild(o);
      });
    }
    if (d && d.ok === false && d.error) {
      toast("模型列表拉取失败，用配置里的列表：" + d.error, 2600);
    }
  } catch (e) {
    toast("模型列表加载失败");
  } finally {
    btn.classList.remove("spin");
  }
}

$("model").addEventListener("change", async (e) => {
  const m = e.target.value;
  if (!m) return;
  try {
    await post("/model", { model: m });
    toast("已切换到 " + m);
  } catch (err) { toast("切换失败"); }
});

$("btn-refresh").onclick = () => loadModels(true);

/* ==========================================================================
   发送与流式接收
   ========================================================================== */
function clearChips() { chipsEl.innerHTML = ""; }

function renderChips(items) {
  clearChips();
  (items || []).slice(0, 4).forEach(t => {
    const b = el("button", "", t);
    b.onclick = () => { qEl.value = t; send(); };
    chipsEl.appendChild(b);
  });
}

function setBusy(b) {
  S.busy = b;
  sendEl.disabled = b;
  qEl.disabled = b;
}

let streamEl = null;
let lastTool = null;

function handleEvent(ev) {
  switch (ev.type) {
    case "status":
      break;
    case "token":
      if (!streamEl) {
        streamEl = addMsg("assistant", "");
        streamEl.classList.add("streaming");
      }
      streamEl.textContent += ev.text || "";
      scrollBottom();
      break;
    case "tool":
      if (streamEl) { streamEl.classList.remove("streaming"); streamEl = null; }
      if (ev.state === "start") {
        lastTool = addToolCard(ev.name, ev.label);
      } else if (lastTool) {
        lastTool.st.textContent = "完成";
        lastTool.st.classList.add("done");
        lastTool.body.textContent = ev.result || "(无输出)";
      }
      break;
    case "reply":
      if (streamEl) {
        // 流式阶段累积的是模型原始输出（结尾可能带 SARAN 行），
        // 收尾必须换成服务端清理过的 ev.text，否则 SARAN 会残留在正文里。
        setRich(streamEl, ev.text || streamEl.textContent);
        streamEl.classList.remove("streaming");
        streamEl = null;
      } else if (!logEl.querySelector(".msg.ai")) {
        addMsg("assistant", ev.text || "", true);
      }
      renderChips(ev.suggestions);
      break;
    case "message":
      addMsg("assistant", ev.text || "");
      break;
    case "error":
      if (streamEl) { streamEl.classList.remove("streaming"); streamEl = null; }
      addNote("出错：" + (ev.text || "未知错误"));
      break;
  }
}

async function send() {
  const text = qEl.value.trim();
  if (!text || S.busy) return;

  qEl.value = "";
  qEl.style.height = "auto";
  clearChips();
  const emptyBox = logEl.querySelector(".empty");
  if (emptyBox) emptyBox.remove();

  addMsg("user", text);
  setBusy(true);
  streamEl = null;
  lastTool = null;

  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    if (!resp.ok) {
      addNote("请求失败：HTTP " + resp.status);
      setBusy(false);
      return;
    }
    const data = await resp.json();
    if (streamEl) { streamEl.classList.remove("streaming"); streamEl = null; }
    if (data && data.error) {
      addNote("出错：" + data.error);
    } else if (data && data.reply) {
      // SSE 已经渲染过就用现成的，没有才补一条
      if (!logEl.querySelector(".msg.ai")) addMsg("assistant", data.reply, true);
      renderChips(data.suggestions);
    }
    await loadSessions();
  } catch (e) {
    addNote("网络错误：" + e);
  } finally {
    setBusy(false);
    qEl.focus();
  }
}

sendEl.onclick = send;
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
qEl.addEventListener("input", () => {
  qEl.style.height = "auto";
  qEl.style.height = Math.min(qEl.scrollHeight, 132) + "px";
});

/* SSE：后台广播的进度事件 */
function connectEvents() {
  try {
    const es = new EventSource("/events");
    es.onmessage = (m) => {
      try { handleEvent(JSON.parse(m.data)); } catch (_) {}
    };
    es.onerror = () => { /* 断线由浏览器自动重连 */ };
  } catch (_) {}
}

/* ==========================================================================
   主题
   ========================================================================== */
const THEME_KEY = "zafxyr-theme";

function themeMode() {
  try { return localStorage.getItem(THEME_KEY) || "light"; } catch (e) { return "light"; }
}

function applyTheme(mode) {
  const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
  const t = mode === "system" ? (prefersLight ? "light" : "dark")
                              : (mode === "light" ? "light" : "dark");
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
  const meta = document.querySelector('meta[name="color-scheme"]');
  if (meta) meta.content = t;
  document.querySelectorAll("#theme-seg button").forEach(b => {
    b.classList.toggle("on", b.dataset.th === mode);
  });
}

document.getElementById("theme-seg").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) applyTheme(b.dataset.th);
});

try {
  window.matchMedia("(prefers-color-scheme: light)")
    .addEventListener("change", () => {
      if (themeMode() === "system") applyTheme("system");
    });
} catch (e) {}

applyTheme(themeMode());

/* ==========================================================================
   设置
   ========================================================================== */
async function openSettings() {
  $("settings").classList.add("on");
  $("s-hint").textContent = "读取中…";
  try {
    const c = await api("/config");
    $("s-base").value = c.base_url || "";
    $("s-model").value = c.model || "";
    $("s-tokens").value = c.max_tokens || "";
    $("s-key").value = "";
    $("s-hint").textContent = (c.has_key ? "已配置 API Key。" : "还没配置 API Key。") +
      " 配置文件：" + (c.config_path || "");
  } catch (e) { $("s-hint").textContent = "读取失败：" + e; }
}

function closeSettings() { $("settings").classList.remove("on"); }

$("btn-settings").onclick = openSettings;
$("s-cancel").onclick = closeSettings;
$("settings").onclick = (e) => { if (e.target === $("settings")) closeSettings(); };

$("s-save").onclick = async () => {
  const body = {
    base_url: $("s-base").value.trim(),
    model: $("s-model").value.trim(),
    max_tokens: parseInt($("s-tokens").value, 10) || 0,
  };
  if ($("s-key").value.trim()) body.api_key = $("s-key").value.trim();
  try {
    const r = await post("/config", body);
    if (r && r.ok) {
      closeSettings();
      toast("已保存");
      await loadModels(true);
      await loadSessions();
    } else {
      toast("保存失败");
    }
  } catch (e) { toast("保存失败：" + e); }
};

/* ==========================================================================
   启动
   ========================================================================== */
(async function boot() {
  renderEmpty();
  await loadSessions();
  const h = await api("/history");
  renderMessages(h);
  await loadModels(false);
  connectEvents();
  // 切回前台时刷新会话状态（不会动模型选择）
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !S.busy) loadSessions().catch(() => {});
  });
})();
